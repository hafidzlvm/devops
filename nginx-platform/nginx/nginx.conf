user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # TLS policy (Mozilla intermediate) — inherited by all server blocks.
    # No per-server include or dhparam file needed; DHE ciphers are not offered.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
    # Server-specific drop-ins (per-server files, gitignored, NOT part of the
    # reusable template). Empty dir = valid, matches nothing.
    include /etc/nginx/servers/*.conf;
    # CORS origin map (generated by 90-generate-cors.sh from .env,
    # hand-editable mid-run + `nginx -s reload`, no restart needed).
    include /etc/nginx/cors.d/*.conf;
}
